<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근거를 보여주는 AI 퍼스널컬러 진단</title>
    
    <!-- 폰트 적용 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 분리된 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>AI 퍼스널컬러 진단</h1>
            <p>흰 종이를 들고 화면에 맞춰 사진을 촬영하세요.</p>
        </header>

        <!-- 웹캠 촬영 섹션 -->
        <section id="webcam-section" class="card">
            <h2>사진 촬영</h2>
            <p>초록색 가이드 박스 안에 흰 종이를 맞춰주세요.</p>
            
            <div class="video-container">
                <video id="webcam-video" autoplay playsinline></video>
                <div id="guide-box" class="guide-box">
                    <span>흰 종이 인식 영역</span>
                </div>
            </div>
            
            <button id="capture-btn" class="btn-primary">촬영 및 진단 시작</button>
            <canvas id="snapshot-canvas" hidden></canvas>
        </section>

        <!-- 로딩 화면 -->
        <section id="loading-section" class="card hidden">
            <div class="spinner"></div>
            <h2>분석 중입니다</h2>
            <p>조명 보정 및 피부 톤/색상을 추출하고 있습니다...</p>
        </section>

        <!-- 결과 화면 -->
        <section id="result-section" class="hidden result-container">
            <div class="result-header-bg">
                <div class="profile-reliability">
                    <img id="result-profile-img" src="" alt="프로필 사진">
                    <div class="reliability-info">
                        <h3 id="reliability-text">신뢰도: 측정 중...</h3>
                        <p id="reliability-desc">분석 중</p>
                    </div>
                </div>

                <div class="diagnosis-card">
                    <h2>퍼스널컬러 진단 결과</h2>
                    <ul class="percentage-list" id="percentage-list"></ul>
                </div>
                
                <div class="best-color-card" id="best-color-card">
                    <p class="best-title">Best Season</p>
                    <h2 class="best-season" id="best-season-name">분석 중</h2>
                </div>
            </div>

            <!-- 조명 자동 보정 검증 -->
            <div class="card correction-card">
                <h2>조명 보정 (White Balancing)</h2>
                <div class="image-comparison">
                    <div class="img-box">
                        <span class="badge">원본</span>
                        <img id="img-original" src="" alt="원본 사진">
                    </div>
                    <div class="img-box">
                        <span class="badge">보정 후</span>
                        <img id="img-corrected" src="" alt="보정된 사진">
                    </div>
                </div>
            </div>

            <div class="mt-20">
                <button id="reset-btn" class="btn-secondary">다시 검사하기</button>
            </div>
        </section>
    </div>
    
    <!-- JS 파일 연동 -->
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
